<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariangel - Globo Terrestre Interactivo</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #000;
        }

        .search-container {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 280px;
        }

        .search-box {
            width: 100%;
            padding: 10px 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        .search-box::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .search-box:focus {
            border-color: #4fc3f7;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.35);
            width: 320px;
        }

        .search-results {
            position: absolute;
            top: 48px;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            overflow: hidden;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(79, 195, 247, 0.2);
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 10px 16px;
            color: #fff;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }

        .search-result-item:hover {
            background: rgba(79, 195, 247, 0.2);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .country-tooltip {
            position: absolute;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            pointer-events: none;
            transform: translate(-50%, -100%);
            margin-top: -15px;
            border: 1px solid rgba(79, 195, 247, 0.4);
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.3);
            white-space: nowrap;
            transition: opacity 0.2s ease;
            display: none;
        }

        .country-tooltip::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid rgba(0, 0, 0, 0.85);
        }

        .info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(10, 10, 30, 0.88);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 16px 20px;
            border-radius: 14px;
            width: 300px;
            border: 1px solid rgba(79, 195, 247, 0.25);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            display: none;
        }

        .info-panel.active {
            display: block;
        }

        .info-panel h3 {
            color: #4fc3f7;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .info-panel p {
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255,255,255,0.8);
        }

        .info-panel .close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            cursor: pointer;
            color: rgba(255,255,255,0.5);
            font-size: 18px;
        }

        .info-panel .close-btn:hover {
            color: #fff;
        }

        .info-panel .detail-sep {
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 10px 0;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-panel .food-flag {
            font-size: 2.6rem;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .info-panel .food-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffb74d;
            margin-bottom: 6px;
        }

        .info-panel .food-capital {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 10px;
        }

        .info-panel .food-photo {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid rgba(255,255,255,0.15);
            margin-bottom: 10px;
            background: #2a2a4a;
            display: block;
        }

        .info-panel .food-desc {
            font-size: 12px;
            line-height: 1.65;
            color: rgba(255,255,255,0.75);
            text-align: left;
        }

        .title-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 6px 0 30px 0;
            text-align: center;
            pointer-events: none;
        }

        .title-bar h1 {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 998;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <h1>Mariangel</h1>
    </div>

    <div class="search-container">
        <input type="text" class="search-box" id="searchInput" placeholder="Buscar pais..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
    </div>

    <div id="map"></div>

    <div class="country-tooltip" id="tooltip"></div>

    <div class="hint">Arrastra para girar el globo • Rueda para acercar</div>

    <div class="info-panel" id="infoPanel">
        <span class="close-btn" onclick="closeInfoPanel()">&times;</span>
        <h3 id="infoName"></h3>
        <p id="infoDetails"></p>
        <div class="detail-sep" id="foodSep">Gastronomia</div>
        <div id="foodBlock" style="display:none;">
            <div class="food-flag" id="foodFlag"></div>
            <div class="food-name" id="foodTitle"></div>
            <div class="food-capital" id="foodCapital"></div>
            <img class="food-photo" id="foodPhoto" alt="Foto de la comida" style="display:none;" />
            <div class="food-desc" id="foodDesc"></div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
        // ====== Gastronomia del mundo (base de datos de comidas por pais) ======
        const comidaPorPais = {
            "El Salvador": { flag: "🇸🇻", capital: "San Salvador", img: "pupusas", comida: "Pupusas", descripcion: "Tortillas gruesas de maíz o arroz rellenas de queso, frijoles refritos o chicharrón, doradas en plancha. Se sirven con curtido (repollo encurtido) y salsa de tomate. Son el plato nacional; cada segundo domingo de noviembre se celebra el Día Nacional de la Pupusa." },
            "Guatemala": { flag: "🇬🇹", capital: "Ciudad de Guatemala", img: "pepian", comida: "Pepián", descripcion: "Guiso espeso de carne condimentado con semillas tostadas (pepitoria, ajonjolí) y chiles secos molidos, junto con verduras. Tiene tres versiones según la carne: de res, de pollo o de cerdo. Es un plato de origen prehispánico que se sirve con arroz y tortillas." },
            "Honduras": { flag: "🇭🇳", capital: "Tegucigalpa", img: "baleadas", comida: "Baleadas", descripcion: "Tortilla de harina de trigo doblada en dos y rellena de frijoles refritos, queso rallado y crema de mantequilla. Es un desayuno o merienda económica y muy popular en la calle. La versión \"con todo\" añade huevo y/o aguacate." },
            "Nicaragua": { flag: "🇳🇮", capital: "Managua", img: "nacatamal", comida: "Nacatamal", descripcion: "Tamal grande de maíz relleno de carne de cerdo o pollo, arroz, papas, tomate y cebolla, envuelto en hojas de plátano. Se cocina al vapor durante horas y se guarda bien para acompañar. Es típico de los fines de semana y las fiestas familiares." },
            "Costa Rica": { flag: "🇨🇷", capital: "San José", img: "gallopinto", comida: "Gallo pinto", descripcion: "Mezcla de arroz y frijoles negros o rojos salteados con cebolla, chile dulce y culantro. Es el corazón del desayuno costarricense y se acompaña con huevo, queso, plátano maduro frito y café. Su nombre describe su apariencia pintada (pintarrajada)." },
            "Panama": { flag: "🇵🇦", capital: "Ciudad de Panamá", img: "sancocho", comida: "Sancocho panameño", descripcion: "Sopa espesa de gallina con ñame, yuca, otoe o plátano y culantro. Es un plato reconfortante, ideal para celebraciones y para los días de lluvia. Casi cada región del país tiene su propia variante con distintos tubérculos." },
            "Colombia": { flag: "🇨🇴", capital: "Bogotá", img: "bandejapaisa", comida: "Bandeja paisa", descripcion: "Plato abundante y colorido con arroz, frijoles, carne de res, chicharrón, huevo frito, plátano maduro, arepa, chorizo y aguacate. Nació en la región de Antioquia y se toma tradicionalmente al mediodía. Se considera el plato más representativo de Colombia." },
            "Venezuela": { flag: "🇻🇪", capital: "Caracas", img: "arepa", comida: "Arepa", descripcion: "Pan redondo y plano de masa de maíz precocida, dorado en un budare. Se abre por la mitad y se rellena con queso, jamón, carne mechada, pollo o el clásico \"reina pepiada\" (de aguacate y pollo). Se come todos los días, en el desayuno o la cena." },
            "Ecuador": { flag: "🇪🇨", capital: "Quito", img: "cevichue", comida: "Ceviche ecuatoriano", descripcion: "Camarones o pescado marinados en jugo de naranja agria y limón, con cebolla, tomate y cilantro. Se sirve frío con tostado o maíz cancha, y a veces con chifles (rodajas de plátano frito). Es un manjar de la costa, delicioso al mediodía." },
            "Peru": { flag: "🇵🇪", capital: "Lima", img: "ceviche", comida: "Ceviche", descripcion: "Pescado o mariscos frescos \"cocinados\" en jugo de limón, con cebolla morada, ají limo y cilantro. Se sirve al momento con camote, choclo (maíz) y cancha serrana. Fue declarado Patrimonio Cultural de la Nación y gran embajador culinario." },
            "Brazil": { flag: "🇧🇷", capital: "Brasilia", img: "feijoada", comida: "Feijoada", descripcion: "Guiso de frijoles negros cocido a fuego lento con varias carnes de cerdo y de res, como tocino, lomo y chorizo. Se acompaña de arroz blanco, col salteada, rodajas de naranja y farofa. Es un plato histórico, hoy símbolo nacional que se disfruta en almuerzos de miércoles y sábado." },
            "Bolivia": { flag: "🇧🇴", capital: "La Paz y Sucre", img: "saltenas", comida: "Salteñas", descripcion: "Empanadas horneadas de masa hojaldrada rellenas de carne o pollo con un jugo calientito, papa, arvejas, huevo cocido y aceituna. El caldo interno las hace especiales: se comen inclinadas para no derramarse. Se disfrutan por la mañana, pocas horas después de hornearse." },
            "Paraguay": { flag: "🇵🇾", capital: "Asunción", img: "chipa", comida: "Chipa", descripcion: "Pan de almidón de mandioca con queso, manteca y un toque de anís, crujiente por fuera y elástico por dentro. Se hornea tradicionalmente en horno de barro, a veces sobre hojas. Es el pan callejero por excelencia en Paraguay y el noreste argentino." },
            "Uruguay": { flag: "🇺🇾", capital: "Montevideo", img: "asado", comida: "Asado", descripcion: "Carne de res asada a la parrilla con sal gruesa, acompañada de chorizos, morcillas y pan. El \"asador\" controla el fuego lento sobre las brasas para lograr el punto justo. Es mucho más que comida: es toda una institución familiar del fin de semana." },
            "Argentina": { flag: "🇦🇷", capital: "Buenos Aires", img: "asado", comida: "Asado", descripcion: "Parrillada criolla de costillas, vacío, chorizo, morcilla y chinchulín, cocinada lentamente a las brasas. Se acompaña de chimichurri, ensalada y vino tinto. Reunir a familia y amigos alrededor del fuego los domingos es una tradición sagrada." },
            "Chile": { flag: "🇨🇱", capital: "Santiago", img: "empanadapino", comida: "Empanada de pino", descripcion: "Empanada de masa de harina de trigo dorada al horno, rellena de \"pino\" (carne de res picada con cebolla), aceituna, pasas y un trozo de huevo cocido. Es el platillo bandera de las Fiestas Patrias del 18 de septiembre. Se come con ají y un buen vino tinto." },
            "Mexico": { flag: "🇲🇽", capital: "Ciudad de México", img: "tacospastor", comida: "Tacos al pastor", descripcion: "Tortillas de maíz rellenas de carne de cerdo marinada en achiote y chiles, asada en un trompo vertical parecido al shawarma. Se sirven con trocitos de piña asada, cebolla, cilantro y salsa. El equilibrio dulce-picante los hace irresistibles hasta la madrugada." },
            "Spain": { flag: "🇪🇸", capital: "Madrid", img: "paella", comida: "Paella", descripcion: "Arroz cocinado con azafrán, caldo y acompañamientos como mariscos, pollo, conejo y verduras, típico de Valencia. Se prepara en una paellera ancha, de preferencia sobre fuego de leña, y el socarrat (fondo tostado) es el premio. Se come directo de la paella. Su cara se ha vuelto icono mundial." },
            "Italy": { flag: "🇮🇹", capital: "Roma", img: "pizza", comida: "Pizza napolitana", descripcion: "Masa fina y suave con bordes inflados, cubierta de tomate San Marzano, mozzarella, albahaca fresca y aceite de oliva. Se hornea a temperaturas altísimas en horno de piedra o leña en apenas 90 segundos. El oficio de los pizzaioli fue declarado Patrimonio Inmaterial de la UNESCO." },
            "France": { flag: "🇫🇷", capital: "París", img: "croissant", comida: "Croissant", descripcion: "Pan de masa laminada con mucha mantequilla: dorado, crujiente por fuera y suave por dentro, con la clásica forma de media luna. Se desayuna a diario con café o chocolate caliente. Aunque se pregona como francés, desciende del \"kipferl\" austríaco." },
            "Germany": { flag: "🇩🇪", capital: "Berlín", img: "bratwurst", comida: "Bratwurst", descripcion: "Salchicha de cerdo asada a la parrilla, sazonada con pimienta, nuez moscada y comino. Se sirve en pan artesanal con mostaza dulce o picante. Cada región guarda celosa su receta: la de Núremberg es pequeña y se ordena en porciones de 6." },
            "United Kingdom": { flag: "🇬🇧", capital: "Londres", img: "fishchips", comida: "Fish and chips", descripcion: "Pescado blanco rebozado en masa crujiente y frito en abundante aceite, servido con papas fritas gruesas, sal, vinagre de malta y guisantes o salsa tártara. Era el almuerzo clásico de los viernes (día de pescado). Sigue siendo el bocado callejero británico por excelencia." },
            "Ireland": { flag: "🇮🇪", capital: "Dublín", img: "stew", comida: "Estofado irlandés", descripcion: "Guiso tradicional de cordero con papas, zanahorias, cebolla y caldo, cocinado a fuego lento hasta que la carne se deshace. No lleva muchos condimentos: el secreto está en los ingredientes humildes y el tiempo de cocción. Es el plato más reconfortante contra el frío irlandés." },
            "Portugal": { flag: "🇵🇹", capital: "Lisboa", img: "bacalao", comida: "Bacalao a la brasa", descripcion: "El bacalao salado es el \"fiel amigo\" de Portugal y se prepara de cientos de maneras; a la brasa se asa con aceite de oliva, ajo y papas. Es plato obligado en la cena de Nochebuena. Se acompaña con aceitunas, pan y un buen vino verde." },
            "Netherlands": { flag: "🇳🇱", capital: "Ámsterdam", img: "stroopwafel", comida: "Stroopwafel", descripcion: "Gofre fino, crujiente y ligeramente caramelizado, relleno de \"stroop\" (almíbar de caramelo). La tradición es colocarlo sobre la taza de café caliente para que el vapor suavice el relleno. Se inventó en Gouda a fines del siglo XIX y conquistó toda Europa." },
            "Belgium": { flag: "🇧🇪", capital: "Bruselas", img: "frites", comida: "Papas fritas belgas", descripcion: "Papas fritas gruesas, doradas y crujientes, freídas dos veces (una a baja y otra a alta temperatura) y servidas en cono de papel. Se acompañan con mayonesa, salsa andaluza o tártara. Bélgica se disputa su invención y las trata como un tesoro nacional." },
            "Switzerland": { flag: "🇨🇭", capital: "Berna", img: "fondue", comida: "Fondue de queso", descripcion: "Quesos gruyer y emmental fundidos con vino blanco y un toque de kirsch (aguardiente de cereza). Se moja pan con tenedores largos y nunca se deja de revolver en forma de 8. La corteza caramelizada del fondo, llamada \"la religieuse\", es el bocado más codiciado." },
            "Turkey": { flag: "🇹🇷", capital: "Ankara", img: "kebab", comida: "Kebab", descripcion: "Carne de cordero, pollo o res marinada y asada; en su versión shish va en brocheta y en la versión döner gira en un trompo vertical. Se sirve con pan plano, arroz, ensalada y yogur. La palabra \"kebap\" significa literalmente \"carne asada\" en turco." },
            "Greece": { flag: "🇬🇷", capital: "Atenas", img: "moussaka", comida: "Moussaka", descripcion: "Sándwich de berenjenas asadas, carne de res picada con tomate y canela, y una capa dorada de crema bechamel gratinada. Es el plato griego más internacional, con raíces en la cocina otomana. Se corta en cuadros y se sirve templado, acompañado de ensalada griega." },
            "Sweden": { flag: "🇸🇪", capital: "Estocolmo", img: "kottbullar", comida: "Albóndigas suecas", descripcion: "Albóndigas de carne molida con cebolla, pan rallado y pimienta, bañadas en una salsa cremosa de crema y caldo. Se sirven de forma clásica con puré de papa, mermelada de arándanos rojos y encurtidos. Un famoso catálogo de muebles las hizo famosas en todo el mundo." },
            "Norway": { flag: "🇳🇴", capital: "Oslo", img: "salmon", comida: "Salmón noruego", descripcion: "Salmón del Atlántico, servido fresco, ahumado o como gravlax (marinado en eneldo, azúcar y sal). El ahumado en frío es un manjar que se sirve sobre pan o tostada con crema. Noruega es uno de los mayores productores de salmón del mundo." },
            "Finland": { flag: "🇫🇮", capital: "Helsinki", img: "karjalanpir", comida: "Karjalanpiirakka", descripcion: "Pastelitos de corteza fina de centeno con relleno cremoso de arroz con leche o puré de papa, y bordes bellamente plegados a mano. Se sirven calientes con \"munavoi\" (mezcla de mantequilla y huevo duro). Son originarios de la región de Carelia." },
            "Poland": { flag: "🇵🇱", capital: "Varsovia", img: "pierogi", comida: "Pierogi", descripcion: "Empanadillas hervidas, rellenas de papa y requesón (las famosas \"ruskie\"), carnes, col fermentada o hasta frutas dulces. Se sirven con cebolla frita, crema agria y mantequilla derretida. Los polacos dicen \"pierogi to pierogi\": un pierogi es un pierogi, sin más explicación." },
            "Russia": { flag: "🇷🇺", capital: "Moscú", img: "borsch", comida: "Borsch", descripcion: "Sopa de color escarlata hecha de remolacha, repollo, papa y zanahoria, servida con una cucharada de crema agria, ajo y hierbas. Se acompaña con pampushka, un panecillo untado en ajo. Es originario de Ucrania y se toma bien caliente en los crudos inviernos." },
            "Czechia": { flag: "🇨🇿", capital: "Praga", img: "svickova", comida: "Svíčková", descripcion: "Solomillo de res marinado con verduras (zanahoria, apio, raíz de perejil) y especias, asado y servido con una crema espesa de verduras, crema ácida y jalea de arándanos o grosella. Se acompaña con knedlíky, unos dumplings de pan tipo bollo. Es el plato nacional checo." },
            "Hungary": { flag: "🇭🇺", capital: "Budapest", img: "gulash", comida: "Gulash", descripcion: "Guiso de res con pimentón, papas, cebolla y pimientos, cocinado a fuego lento en una olla colgante llamada bogrács. Puede servirse como sopa espesa o plato principal. El pimentón húngaro, dulce y ahumado, es el alma de la receta." },
            "Egypt": { flag: "🇪🇬", capital: "El Cairo", img: "koshari", comida: "Koshari", descripcion: "Hormeada mezcla de arroz, lentejas, macarrones y garbanzos, bañada en salsa de tomate picante y coronada con cebolla frita crujiente y ajo. Es barato, nutritivo y 100 % vegetariano, vendido en cada esquina de El Cairo. Es el plato nacional egipcio." },
            "Morocco": { flag: "🇲🇦", capital: "Rabat", img: "couscous", comida: "Cuscús", descripcion: "Sémola de trigo cocida al vapor tres veces sobre el caldo, servida con verduras de temporada, garbanzos y carnes de pollo o cordero. Se cocina en un \"couscoussier\" de dos pisos. En Marruecos es plato de viernes, el día sagrado, y se comparte en familia." },
            "Nigeria": { flag: "🇳🇬", capital: "Abuya", img: "jollof", comida: "Jollof rice", descripcion: "Arroz cocinado en una base de tomate, cebolla, pimiento scotch bonnet y especias, con ese característico sabor ahumado del fondo de la olla. Se sirve con pollo o pescado asado y plátanos fritos. Rivaliza con el jollof de Ghana en la mayor batalla culinaria de África." },
            "Ethiopia": { flag: "🇪🇹", capital: "Adís Abeba", img: "doro", comida: "Injera con Doro Wat", descripcion: "El injera, un pan suave y esponjoso de teff fermentado, sirve como plato y como cuchara para el doro wat, un guiso picante de pollo con berbere (mezcla de especias etíopes), cebolla y huevos duros. Se come con las manos, todos del mismo plato, en comunidad." },

        map.on('load', () => {
            // Atmosfera del globo (estilo Google Earth)
            map.setSky({
                'sky-color': '#020408',
                'horizon-color': '#1a2f63',

            // Fuente y capas de paises sobre el mapa base
            if (!map.getSource('countries')) {
                map.addSource('countries', {
                    type: 'geojson',
                    data: 'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson'
                });
            }

            if (!map.getLayer('country-line')) {
                map.addLayer({
                    id: 'country-line',
                    type: 'line',
                    source: 'countries',
                    paint: {
                        'line-color': 'rgba(20, 90, 200, 0.55)',
                        'line-width': 0.6
                    }
                });
            }

            if (!map.getLayer('country-fill')) {
                map.addLayer({
                    id: 'country-fill',
                    type: 'fill',
                    source: 'countries',
                    paint: {
                        'fill-color': '#4fc3f7',
                        'fill-opacity': 0
                    }
                });
            }

            if (!map.getLayer('country-borders')) {
                map.addLayer({
                    id: 'country-borders',
                    type: 'fill-extrusion',
                    source: 'countries',
                    paint: {
                        'fill-extrusion-color': '#4fc3f7',
                        'fill-extrusion-opacity': 0.25,
                        'fill-extrusion-height': 0,
                        'fill-extrusion-base': 0
                    },
                    filter: ['==', ['get', 'name'], '']
                }, 'country-fill');
            }

            if (!map.getLayer('country-hover')) {
                map.addLayer({
                    id: 'country-hover',
                    type: 'fill',
                    source: 'countries',
                    paint: {
                        'fill-color': '#ffd54f',
                        'fill-opacity': 0.45
                    },
                    filter: ['==', ['get', 'name'], '']
                }, 'country-line');
            }

            // Click sobre el globo: identificar pais
            map.on('click', (e) => {
                const features = map.queryRenderedFeatures(e.point, {
                    layers: ['country-fill', 'country-borders', 'country-hover']
                });
                if (features.length > 0) {
                    const props = features[0].properties;
                    const name = props.name || props.ADMIN || 'Desconocido';
                    selectCountry(name, props, e.lngLat);
                }
            });

            let lastHover = '';
            map.on('mousemove', (e) => {
                const features = map.queryRenderedFeatures(e.point, {
                    layers: ['country-fill', 'country-borders', 'country-hover']
                });
                if (features.length > 0) {
                    const name = features[0].properties.name || features[0].properties.ADMIN || 'Desconocido';
                    if (name !== lastHover) {
                        lastHover = name;
                        map.setFilter('country-hover', ['==', ['get', 'name'], name]);
                    }
                    showTooltip(e.point, name);
                    map.getCanvas().style.cursor = 'pointer';
                } else {
                    if (lastHover) {
                        lastHover = '';

                    }
                    hideTooltip();
                    map.getCanvas().style.cursor = '';
                }

        const tooltip = document.getElementById('tooltip');

        const colorPalette = ['#4fc3f7', '#81c784', '#ffb74d', '#e57373', '#ba68c8', '#4dd0e1', '#fff176', '#f06292'];
        let colorIndex = 0;
        function getNextColor() {
            const c = colorPalette[colorIndex % colorPalette.length];
            colorIndex++;
            return c;
        }

        function showTooltip(point, text) {
            tooltip.textContent = text;
            tooltip.style.display = 'block';
            tooltip.style.left = point.x + 'px';
            tooltip.style.top = point.y + 'px';

        function hideTooltip() {

        }

        function highlightCountry(name) {
            map.setPaintProperty('country-fill', 'fill-color', '#4fc3f7');
            map.setPaintProperty('country-fill', 'fill-opacity', 0.25);
            map.setFilter('country-fill', ['==', ['get', 'name'], name]);
            map.setFilter('country-borders', ['==', ['get', 'name'], name]);
        }

        function resetHighlight() {
            map.setFilter('country-fill', null);
            map.setFilter('country-borders', null);
            map.setPaintProperty('country-fill', 'fill-opacity', 0);
        }

        function flyToCountry(name) {
            const match = allCountries.find(c => c.name === name);
            if (match && match.bounds) {
                map.fitBounds(match.bounds, { padding: 60, duration: 1200, maxZoom: 4 });
            }
        }

        function getBoundsFromFeature(feature) {
            const coords = feature.geometry.coordinates;
            let minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
            const walk = (ring) => {
                ring.forEach((c) => {
                    if (c[0] < minLng) minLng = c[0];
                    if (c[0] > maxLng) maxLng = c[0];
                    if (c[1] < minLat) minLat = c[1];
                    if (c[1] > maxLat) maxLat = c[1];
                });
            };
            const geom = feature.geometry;
            if (geom.type === 'Polygon') geom.coordinates.forEach(walk);
            else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(p => p.forEach(walk));
            if (minLat === Infinity) return [[-10, -10], [10, 10]];
            return [[minLng, minLat], [maxLng, maxLat]];
        }

        function selectCountry(name, props, lngLat) {
            highlightCountry(name);
            const center = lngLat || { lng: 0, lat: 0 };
            showInfoPanel(name, props, center);
            flyToCountry(name);
        }

        function flagFromISO(code) {
            if (!code || code.length !== 2) return '';
            return code.toUpperCase().replace(/./g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0)));
        }

        function getFoodData(name, props) {
            const base = comidaPorPais[name];
            if (base) {
                return { has: true, flag: base.flag, capital: base.capital, food: base.comida, desc: base.descripcion, img: base.img };
            }
            const extra = comidaExtra && comidaExtra[name];
            if (extra) {
                return {
                    has: true,
                    flag: flagFromISO(props ? props['ISO3166-1-Alpha-2'] : '') || '🌍',
                    capital: extra[0],
                    food: extra[1],
                    desc: extra[2],
                    img: null
                };
            }
            return { has: false };
        }

        function showInfoPanel(name, properties, center) {
            const panel = document.getElementById('infoPanel');
            const details = [
                properties.name ? `Nombre: ${nombreEspanol[properties.name] || properties.name}` : '',
                properties['ISO3166-1-Alpha-3'] ? `Codigo ISO: ${properties['ISO3166-1-Alpha-3']}` : '',
                `Coordenadas: ${center.lat.toFixed && center.lat ? center.lat.toFixed(2) + '°' : ''} ${center.lng.toFixed && center.lng ? center.lng.toFixed(2) + '°' : ''}`
            ].filter(Boolean).join('<br>');

            document.getElementById('infoName').textContent = nombreEspanol[name] || name;
            document.getElementById('infoDetails').innerHTML = details;

            const comida = getFoodData(name, properties);
            const foodBlock = document.getElementById('foodBlock');
            const foodSep = document.getElementById('foodSep');
            const photo = document.getElementById('foodPhoto');
            if (comida.has) {
                document.getElementById('foodFlag').textContent = comida.flag;
                document.getElementById('foodTitle').textContent = '🍽️ ' + comida.food;
                document.getElementById('foodCapital').textContent = '🏛️ Capital: ' + comida.capital;
                if (comida.img) {
                    photo.src = 'img/' + comida.img + '.jpg';
                    photo.alt = 'Foto de ' + comida.food;
                    photo.style.display = 'block';
                } else {
                    photo.removeAttribute('src');
                    photo.style.display = 'none';
                }
                document.getElementById('foodDesc').textContent = comida.desc;
                foodBlock.style.display = 'block';
                foodSep.style.display = '';
            } else {
                foodBlock.style.display = 'none';
                foodSep.style.display = 'none';
            }

            panel.classList.add('active');
        }

        function closeInfoPanel() {
            document.getElementById('infoPanel').classList.remove('active');
            resetHighlight();
            selectedName = null;
        }

        // ====== Busqueda ======
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        let allCountries = [];
        let countriesLoaded = false;

        map.on('load', () => {
            if (countriesLoaded) return;
            fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
                .then(r => r.json())
                .then(data => {
                    allCountries = data.features.map(f => ({
                        name: f.properties.ADMIN || f.properties.name,
                        props: f.properties,
                        bounds: getBoundsFromFeature(f)
                    })).filter(c => c.name);
                    countriesLoaded = true;
                })
                .catch(() => {});
        });

        searchInput.addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();
            searchResults.innerHTML = '';

            if (query.length < 2) {
                searchResults.classList.remove('active');
                return;
            }

            const matches = allCountries.filter(c =>
                c.name.toLowerCase().includes(query) ||
                (nombreEspanol[c.name] && nombreEspanol[c.name].toLowerCase().includes(query))
            ).slice(0, 8);

            if (matches.length === 0) {
                searchResults.classList.remove('active');
                return;
            }

            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'search-result-item';
                const displayName = nombreEspanol[match.name] || match.name;
                div.textContent = displayName;
                div.addEventListener('click', () => {
                    selectCountry(match.name, match.props, { lng: 0, lat: 0 });
                    searchInput.value = displayName;
                    searchResults.classList.remove('active');
                });
                searchResults.appendChild(div);
            });

            searchResults.classList.add('active');
        });

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.search-container')) {
                searchResults.classList.remove('active');
            }
        });

        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                this.value = '';
                searchResults.classList.remove('active');
                this.blur();
            }
        });
    </script>
</body>
</html>
